name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser runtime
        run: pnpm --filter @tempad-dev/extension test:setup

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm --workspace-concurrency=1 -r --if-present test:run

      - name: Test internal installer
        run: pnpm internal:test

      - name: Format check
        run: pnpm format:check

      - name: Build project
        run: pnpm build

      - name: Check bridge compatibility
        run: pnpm mcp:check-bridge

      - name: Build internal kit
        run: pnpm internal:build

      - name: Check internal kit
        run: pnpm internal:check
